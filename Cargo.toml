[package]
name = "app-card-english"
version = "0.6.2"
edition = "2024"
rust-version = "1.89"
publish = false

[[bin]]
name = "card-english"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = "0.57"
tray-icon = "0.26"
notify-rust = "4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
png = "0.18"
# Sign in with ChatGPT: PKCE and the random values of each attempt.
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
# The Downloads folder for exports, wherever the system keeps it.
dirs = "7"
# The shortcut that adds the copied word from any app.
global-hotkey = "0.9"
sherpa-onnx = "=2.0.1"
# The result of a recognition as sherpa-onnx writes it, with the probabilities of its tokens that the wrapper drops;
# speech.rs reads it through the inside of the wrapper's stream, so both stay at this version.
sherpa-onnx-sys = { version = "=2.0.1", default-features = false }
# Unpacking the Kokoro voice packs: the tar of Windows 10 cannot read bzip2.
bzip2 = "0.6"
tar = { version = "0.4", default-features = false }
# The Google Drive sync document, gzipped; already in the tree through other crates.
flate2 = "1"

# The time on the learner's clock, for reminders at a set hour; std knows only UTC.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Also the PC's own architecture (IsWow64Process2), so that an x64 build emulated on an ARM64 PC updates to the arm64 zip.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading"] }

# The GPU of a Mac; other machines run on the CPU.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9", features = ["metal"] }
candle-nn = { version = "0.9", features = ["metal"] }
candle-transformers = { version = "0.9", features = ["metal"] }
# Clearing the old reminders from the Notification Center; already in the tree through tao and notify-rust.
objc2 = "0.6"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }

# Not only on Windows: the Windows app is also built from a Mac (scripts/package-windows.sh).
[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# candle is unusably slow without optimisation, even while developing.
[profile.dev.package."*"]
opt-level = 3
