name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The Windows install script against the latest release: it installs, installs again as an update, and the
      # command it leaves in Settings, Apps removes it all.
      - name: Install script
        if: runner.os == 'Windows'
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $script = Get-Content -Raw -Encoding UTF8 scripts/install.ps1
          iex $script
          iex $script
          $dir = "$env:LOCALAPPDATA\Programs\CardEnglish"
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Card English.lnk'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\CardEnglish'
          if (-not ((Test-Path "$dir\CardEnglish.exe") -and (Test-Path $shortcut) -and (Test-Path $key))) { throw 'not installed' }
          iex "& $((Get-ItemProperty $key).UninstallString)"
          if ((Test-Path $dir) -or (Test-Path $shortcut) -or (Test-Path $key)) { throw 'not removed' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
