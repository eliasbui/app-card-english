name: release

# A tag such as v0.2.0 builds the app for macOS and Windows and publishes the GitHub release that the
# update check in the app reads.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - name: Bundle for macOS
        if: runner.os == 'macOS'
        run: |
          UNIVERSAL=1 scripts/bundle-macos.sh
          cd dist && ditto -c -k --keepParent "Card English.app" "CardEnglish-${GITHUB_REF_NAME#v}-macos.zip"
      - name: Bundle for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          Copy-Item target/release/card-english.exe "dist/CardEnglish.exe"
          Compress-Archive -Path dist/CardEnglish.exe -DestinationPath "dist/CardEnglish-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error

  # One job publishes, so that the two builds never race to create the same release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
