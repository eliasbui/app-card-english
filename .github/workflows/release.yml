name: release

# A tag such as v0.2.0 builds the Windows app and adds it to the GitHub release that the update check in the app
# reads. The macOS app is built and published from a Mac by scripts/release.sh, which also pushes the tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - name: Bundle for Windows
        shell: pwsh
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          Copy-Item target/release/card-english.exe "dist/CardEnglish.exe"
          Compress-Archive -Path dist/CardEnglish.exe -DestinationPath "dist/CardEnglish-$version-windows-x64.zip"
      # Adds the zip to the release scripts/release.sh made, or makes it when the workflow gets there first.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
